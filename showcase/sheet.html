<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Contact sheet</title>
<style>
  html, body { margin: 0; background: #e7e5e0; font: 13px/1.3 ui-monospace, monospace; color: #1a1a1a; }
  main { display: grid; grid-template-columns: repeat(var(--cols), var(--tile)); gap: 12px; padding: 12px; width: max-content; align-items: start; }
  figure { margin: 0; background: #fff; width: var(--tile); }
  figcaption { padding: 4px 8px; font-weight: 700; }
  .clip { position: relative; overflow: hidden; width: var(--tile); }
  iframe { border: 0; transform-origin: 0 0; display: block; }
</style>
</head>
<body><main></main>
<script type="module">
// Query: section, theme, mode, width (default 1280). Tiles are sized so one image stays near 1,300 tokens.
const q = new URLSearchParams(location.search);
const width = Number(q.get("width")) || 1280;
const phone = width < 600;
const TILE = phone ? 230 : 482;
const MAX = phone ? 800 : 800;
const scale = TILE / width;
const main = document.querySelector("main");
main.style.setProperty("--cols", phone ? 4 : 2);
main.style.setProperty("--tile", TILE + "px");
const manifest = await (await fetch("manifest.json")).json();
const items = manifest.items.filter((item) => item.section === q.get("section"));
const frames = items.map((item) => {
  const figure = document.createElement("figure");
  const caption = document.createElement("figcaption");
  caption.textContent = item.title;
  const clip = document.createElement("div");
  clip.className = "clip";
  const frame = document.createElement("iframe");
  frame.title = item.title;
  frame.style.width = width + "px";
  frame.style.height = MAX + "px";
  frame.style.transform = `scale(${scale})`;
  clip.style.height = MAX * scale + "px";
  const params = new URLSearchParams({ item: item.id, reduced: "1", spacers: "0" });
  for (const name of ["theme", "mode"]) if (q.get(name)) params.set(name, q.get(name));
  frame.src = "render.html?" + params;
  clip.append(frame);
  figure.append(caption, clip);
  main.append(figure);
  return { frame, clip };
});
const ready = (frame) => new Promise((resolve) => {
  const check = () => (frame.contentDocument?.documentElement.hasAttribute("data-showcase-ready") ? resolve() : setTimeout(check, 50));
  check();
});
await Promise.all(frames.map(({ frame }) => ready(frame)));
// A short section gets a short tile.
for (const { frame, clip } of frames) {
  const doc = frame.contentDocument;
  const height = Math.min(MAX, Math.max(doc.body.scrollHeight, 120));
  frame.style.height = height + "px";
  clip.style.height = height * scale + "px";
}
document.documentElement.setAttribute("data-showcase-ready", "");
</script>
</body>
</html>
