<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects as a dispatch board</title>
<link rel="stylesheet" href="/skills/ui-craft/assets/kit/base/tokens.css">
<link rel="stylesheet" href="/skills/ui-craft/assets/kit/base/reset.css">
<link rel="stylesheet" href="/skills/ui-craft/assets/kit/base/base.css">
<link rel="stylesheet" href="/skills/ui-craft/assets/kit/base/utilities.css">
<link rel="stylesheet" href="/skills/ui-craft/assets/kit/motion/motion.css">
<style>
.board { background: var(--ink); color: var(--bg); padding: var(--space-6); border-radius: var(--radius-lg); font-family: var(--font-mono); }
.board__head, .board__row { display: grid; grid-template-columns: 4rem minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr); gap: var(--space-4); align-items: baseline; }
.board__head { font-size: var(--text-xs); opacity: 0.75; padding-bottom: var(--space-3); border-bottom: 1px solid currentColor; }
.board__list { list-style: none; padding: 0; }
.board__row { padding-block: var(--space-4); border-bottom: 1px dashed currentColor; font-size: var(--text-sm); }
.board__row:last-child { border-bottom: 0; }
.board__name { font-size: var(--text-lead); font-weight: 600; }
.board__row a { color: inherit; }
.board__label { display: none; font-size: var(--text-xs); opacity: 0.75; }
@media (max-width: 767px) {
  .board__head { display: none; }
  .board__row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .board__name { grid-column: 1 / -1; }
  .board__year { grid-column: 1 / -1; }
  .board__label { display: block; }
}
</style>
</head>
<body>
<main><section class="section"><div class="container">
<!-- sample:start -->
<div class="section__head"><h2>Dispatched work</h2></div>
<div class="board">
<div class="board__head" aria-hidden="true"><span>Year</span><span>Project</span><span>Was</span><span>Now</span></div>
<ol class="board__list">
<li class="board__row"><span class="board__year">2024</span><span class="board__name">Route board</span><span><span class="board__label">Was</span>40 minutes a day</span><span><span class="board__label">Now</span>12 minutes a day</span></li>
<li class="board__row"><span class="board__year">2022</span><span class="board__name">Ledger sync</span><span><span class="board__label">Was</span>3 days a month</span><span><span class="board__label">Now</span>1 day a month</span></li>
<li class="board__row"><span class="board__year">2021</span><span class="board__name">Reader kit</span><span><span class="board__label">Was</span>15 hours of checks</span><span><span class="board__label">Now</span>None</span></li>
</ol>
</div>
<!-- sample:end -->
</div></section></main>
</body>
</html>
