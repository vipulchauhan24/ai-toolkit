<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ui-craft showcase</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<aside class="side">
  <h1>ui-craft showcase</h1>
  <input id="search" type="search" placeholder="Search" aria-label="Search items">
  <nav id="list" aria-label="Kit items"></nav>
</aside>
<div class="work">
  <header class="bar" id="bar"></header>
  <div class="title">
    <button id="prev" aria-label="Previous item">&larr;</button>
    <strong id="name"></strong>
    <button id="next" aria-label="Next item">&rarr;</button>
    <span id="meta"></span>
    <span class="grow"></span>
    <button id="replay">Replay</button>
    <button id="source-toggle" aria-expanded="false">Source</button>
    <a id="alone" target="_blank" rel="noopener">Open alone</a>
  </div>
  <main class="stage" id="stage"><div class="scaler" id="scaler"><iframe id="frame" title="Selected kit item"></iframe></div></main>
  <section class="source" id="source" hidden aria-label="Source">
    <div class="tabs" id="tabs"></div>
    <div class="code-wrap"><button id="copy">Copy</button><pre><code id="code"></code></pre></div>
  </section>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
