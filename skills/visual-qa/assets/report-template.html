<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual QA report</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f7f7f5; --surface: #ffffff; --line: #e2e1dc; --ink: #1c1c1a; --muted: #62615b;
  --a: #1a7f4b; --b: #4a7f1a; --c: #93700a; --d: #b4540f; --f: #b3261e; --na: #62615b;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #151513; --surface: #1f1f1c; --line: #34332e; --ink: #ececE7; --muted: #a6a59c;
    --a: #5fce94; --b: #a3cf63; --c: #e0bb4f; --d: #f0935a; --f: #f2837b; --na: #a6a59c; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 32px 24px 64px; }
h1 { font-size: 26px; margin: 0; } h2 { font-size: 18px; margin: 32px 0 12px; } h3 { font-size: 15px; margin: 0; }
.top { display: flex; gap: 24px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.muted { color: var(--muted); font-size: 13px; }
.grade { font-weight: 700; display: inline-block; min-width: 1.6em; text-align: center; }
.grade.big { font-size: 56px; line-height: 1; }
.A { color: var(--a); } .B { color: var(--b); } .C { color: var(--c); } .D { color: var(--d); } .F { color: var(--f); } .NA { color: var(--na); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px; }
ol, ul { margin: 8px 0 0; padding-left: 20px; } li { margin: 4px 0; }
.routes { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 8px; }
.filters { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 12px 0; display: flex; gap: 16px; flex-wrap: wrap; }
label { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
.card { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 20px; margin-top: 16px; }
@media (max-width: 860px) { .card { grid-template-columns: 1fr; } }
.shots { max-height: 720px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.shots img { display: block; width: 100%; height: auto; }
.head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin-bottom: 8px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
td, th { padding: 6px 8px 6px 0; border-top: 1px solid var(--line); text-align: left; vertical-align: top; }
th { font-weight: 600; color: var(--muted); border-top: 0; font-size: 12px; }
.was { color: var(--muted); font-size: 12px; }
.check { font-size: 13px; margin: 2px 0; overflow-wrap: anywhere; }
.tag { font-size: 11px; font-weight: 700; text-transform: uppercase; margin-right: 6px; }
.tag.fail { color: var(--f); } .tag.warn { color: var(--c); }
code { font-size: 12px; }
.extra img { max-width: 240px; border: 1px solid var(--line); border-radius: 8px; display: block; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>Visual QA report</h1><div class="muted" id="meta"></div></div>
    <div><div class="muted">Overall</div><span class="grade big" id="overall"></span></div>
  </div>
  <div class="panel" style="margin-top:20px">
    <div id="summary"></div>
    <div class="routes" id="routes"></div>
  </div>
  <h2>Fix these first</h2>
  <div class="panel"><ol id="fixes"></ol></div>
  <div id="site"></div>
  <h2>Screenshots</h2>
  <div class="filters">
    <label>Route <select id="f-route"></select></label>
    <label>Viewport <select id="f-view"></select></label>
    <label>Theme <select id="f-theme"></select></label>
  </div>
  <div id="cards"></div>
  <p class="muted">Motion is graded from measurements only: hover and entrance animation cannot be judged from still images.</p>
</div>
<script id="data" type="application/json">__REPORT_DATA__</script>
<script>
// Everything from the page under test is placed with textContent, never as HTML.
const D = JSON.parse(document.getElementById("data").textContent);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; };
const gradeEl = (g, big) => el("span", "grade " + (g === "N/A" ? "NA" : g) + (big ? " big" : ""), g);
const $ = (id) => document.getElementById(id);

$("meta").textContent = D.run.url + " · " + D.run.ended + " · " + (D.run.headed ? "visible browser" : "headless");
$("overall").replaceWith(gradeEl(D.overall, true));
$("summary").textContent = D.summary;
for (const [route, grade] of Object.entries(D.routes)) {
  const r = el("span"); r.append(el("code", "", route + " "), gradeEl(grade)); $("routes").append(r);
}
D.top_fixes.forEach((x) => $("fixes").append(el("li", "", x)));

const checkLine = (f) => {
  const p = el("div", "check");
  p.append(el("span", "tag " + f.severity, f.severity));
  p.append(document.createTextNode(f.message + (f.count > 1 ? " (" + f.count + ")" : "") + (f.samples.length ? ": " + f.samples.join("; ") : "")));
  return p;
};

const site = $("site");
const anyRoute = Object.values(D.route_findings).some((x) => x.length);
if (anyRoute || D.notes.length || D.errors.length || D.skipped_routes.length || D.extras.length) {
  site.append(el("h2", "", "Keyboard, links, forms and reduced motion"));
  const p = el("div", "panel");
  for (const [route, findings] of Object.entries(D.route_findings)) {
    if (!findings.length) continue;
    p.append(el("h3", "", route));
    findings.forEach((f) => p.append(checkLine(f)));
  }
  D.notes.forEach((n) => p.append(el("div", "check muted", n)));
  D.errors.forEach((n) => p.append(el("div", "check", "Capture problem: " + n)));
  if (D.skipped_routes.length) p.append(el("div", "check muted", "Not checked (over the limit): " + D.skipped_routes.join(", ")));
  D.extras.forEach((x) => {
    const box = el("div", "extra"); box.append(el("div", "check", x.label + " (" + x.route + ")"));
    const img = el("img"); img.src = x.image; img.alt = x.label; box.append(img); p.append(box);
  });
  site.append(p);
}

const fill = (id, values) => {
  const s = $(id); s.append(new Option("All", ""));
  [...new Set(values)].forEach((v) => s.append(new Option(v, v)));
  s.addEventListener("change", render);
};
fill("f-route", D.shots.map((s) => s.route));
fill("f-view", D.shots.map((s) => String(s.viewport[0])));
fill("f-theme", D.shots.map((s) => s.theme));
$("f-route").value = D.shots[0].route; // one route at a time keeps a long report quick to open

function card(s) {
  const c = el("div", "card panel");
  const left = el("div", "shots");
  s.tiles.forEach((src, i) => { const img = el("img"); img.src = src; img.alt = s.id + " part " + (i + 1); img.loading = "lazy"; left.append(img); });
  const right = el("div");
  const head = el("div", "head");
  const name = el("div"); name.append(el("h3", "", s.route + " · " + s.viewport[0] + "×" + s.viewport[1] + " · " + s.theme));
  if (s.truncated) name.append(el("div", "muted", "Very long page: only the first part was captured."));
  if (s.full) name.append(el("div", "muted", s.full));
  head.append(name, gradeEl(s.overall, false));
  right.append(head);
  const t = el("table"); const hr = el("tr");
  ["Area", "Grade", "Why"].forEach((x) => hr.append(el("th", "", x))); t.append(hr);
  for (const a of Object.values(s.areas)) {
    const tr = el("tr"); tr.append(el("td", "", a.name));
    const g = el("td"); g.append(gradeEl(a.grade));
    if (a.capped_from) g.append(el("div", "was", "was " + a.capped_from));
    tr.append(g);
    tr.append(el("td", "", a.reason + (a.capped_from ? " Lowered by: " + a.capped_by.join(", ") + "." : "")));
    t.append(tr);
  }
  right.append(t);
  if (s.findings.length) { right.append(el("h3", "", "Measured checks")); s.findings.forEach((f) => right.append(checkLine(f))); }
  if (s.console.length) { right.append(el("h3", "", "Console errors")); s.console.forEach((x) => right.append(el("div", "check", x))); }
  if (s.failed_requests.length) { right.append(el("h3", "", "Failed requests")); s.failed_requests.forEach((x) => right.append(el("div", "check", x))); }
  c.append(left, right);
  return c;
}

function render() {
  const route = $("f-route").value, view = $("f-view").value, theme = $("f-theme").value;
  const box = $("cards"); box.replaceChildren();
  D.shots.filter((s) => (!route || s.route === route) && (!view || String(s.viewport[0]) === view) && (!theme || s.theme === theme))
    .forEach((s) => box.append(card(s)));
}
render();
</script>
</body>
</html>
